<body>

<canvas id="sky"></canvas>

<article class="wrap">

</footer>

<script>
  const sky = document.getElementById("sky");
  const ctx = sky.getContext("2d");
  let stars = [];

  function buildSky() {
    sky.width = innerWidth * devicePixelRatio;
    sky.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    const count = Math.floor((innerWidth * innerHeight) / 9000);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      r: Math.random() * 1.1 + 0.2,
      base: Math.random() * 0.5 + 0.15,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.4 + 0.1,
    }));
  }

  function drawSky(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const s of stars) {
      const twinkle = s.base + Math.sin(t * 0.0006 * s.speed + s.phase) * 0.14;
      ctx.globalAlpha = Math.max(0.05, twinkle);
      ctx.fillStyle = "#e8e4d8";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(drawSky);
  }

  buildSky();
  addEventListener("resize", buildSky);
  requestAnimationFrame(drawSky);
</script>

</body>
